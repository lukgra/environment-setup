# Merged Noctalia config
# Base: hand-written config.toml
# Overlay: GUI settings.toml (wins on conflicts, same as Noctalia's own load order)

[accessibility]
ui_scale = 1.20

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.8
    capsule_group = []
    capsule_thickness = 0.69
    center = [ "clock" ]
    concave_edge_corners = true
    end = []
    font_family = "MesloLGL Nerd Font Mono"
    font_weight = 700
    hover_highlight = false
    margin_edge = 0
    margin_ends = 1504
    padding = 20
    radius = 44
    radius_bottom_left = 80
    radius_bottom_right = 80
    radius_top_left = 80
    radius_top_right = 80
    scale = 1.35
    start = []
    thickness = 34

        [bar.default.dead_zone.actions]
        left = "panel-toggle control-center home"

    # Old hand-written bar layout, overridden by the GUI values above.
    # To go back to it: remove center/start/end/capsule_group above, then uncomment:
    #
    # center = [ "workspaces", "spacer_1", "active_window" ]
    # start = [ "launcher", "clock", "spacer_1", "group:g1" ]
    # end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "session" ]
    #
    # [[bar.default.capsule_group]]
    # border = ""
    # fill = "on_secondary"
    # id = "g1"
    # members = [ "temp", "sysmon_2", "sysmon_3" ]
    # opacity = 1.0
    # padding = 6.0

[calendar]

[control_center]
width = 770

    [control_center.calendar]
    show_events_card = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1600.0
    cy = 1236.25
    output = "DP-1"
    placement_height = 1350.0
    placement_width = 3200.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = false
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    # GUI list (replaces the old one, which also had "kitty" and "alacritty")
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/lucas/Repositories/environment-setup/backgrounds"

    [wallpaper.default]
    path = "/home/lucas/Repositories/environment-setup/backgrounds/ultrawide/waves.png"

    [wallpaper.last]
    path = "/home/lucas/Repositories/environment-setup/backgrounds/ultrawide/waves.png"

    [wallpaper.monitors.DP-1]
    path = "/home/lucas/Repositories/environment-setup/backgrounds/ultrawide/waves.png"

[widget.clock]
color = "primary"
format = "{:%H:%M}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_value = false

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false
